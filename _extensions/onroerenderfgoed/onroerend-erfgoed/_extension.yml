name: onroerend-erfgoed
title: Onroerend Erfgoed Theme
author: Maarten Vermeyen
version: 0.3.2
quarto-required: ">=1.10.0"
contributes:
  metadata:
    project:
      brand: _brand.yml
  formats:
    html:
      theme:
        - default
        - theme.scss
      css:
        - fonts.css
    html+header:
      theme:
        - default
        - theme.scss
      css:
        - fonts.css
        - global_header.css
